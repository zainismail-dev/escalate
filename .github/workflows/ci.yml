name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-urd libpango-1.0-0 libpangoft2-1.0-0
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python -m escalate.playbooks.validate playbooks/
      - run: uv run pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t escalate:ci .
      - name: smoke test the image (imports, OCR binary, PDF rendering)
        run: |
          docker run --rm escalate:ci tesseract --version
          docker run --rm escalate:ci python -c "import escalate.api.main; from escalate.export.pdf import letter_pdf; assert letter_pdf('t', 'hello').startswith(b'%PDF'); print('ok')"
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: node scripts/check-messages.mjs
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
  web-e2e:
    runs-on: ubuntu-latest
    needs: web
    env:
      NEXT_TELEMETRY_DISABLED: 1
      API_URL: http://localhost:8000
      WEB_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync
      - name: start the API (demo mode, throwaway data, no AI model)
        run: |
          export FERNET_KEY=$(uv run python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          mkdir -p /tmp/esc
          DEMO_MODE=true DATABASE_URL=sqlite:////tmp/esc/escalate.db CHECKPOINT_DB=/tmp/esc/cp.db \
          EVIDENCE_DIR=/tmp/esc/ev ESCALATE_SETTINGS_FILE=/tmp/esc/settings.json \
          MODEL_SMART=none MODEL_FAST=none LLM_BASE_URL=http://127.0.0.1:9/v1 \
          nohup uv run uvicorn escalate.api.main:app --port 8000 > /tmp/esc/api.log 2>&1 &
          for i in $(seq 30); do curl -fsS $API_URL/health && break; sleep 1; done
      - name: build and start the web app
        working-directory: web
        run: |
          npm ci
          NEXT_PUBLIC_API_URL=$API_URL npm run build
          cp -r .next/static .next/standalone/.next/
          PORT=3000 nohup node .next/standalone/server.js > /tmp/esc/web.log 2>&1 &
          for i in $(seq 30); do curl -fsS -o /dev/null $WEB_URL && break; sleep 1; done
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: E2E_RESET=1 npx playwright test --project=smoke --project=rtl --project=dark --project=mobile
        working-directory: web
      - if: failure()
        run: tail -100 /tmp/esc/api.log /tmp/esc/web.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
