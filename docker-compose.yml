# Ports are published on 127.0.0.1 only: Escalate has NO login. `make up ALLOW_LAN=true`
# publishes them on every network interface (BIND_ADDR=0.0.0.0) and prints a warning.
services:
  ollama:                       # free local LLM; remove if you use a cloud key
    image: ollama/ollama
    volumes: ["./data/ollama:/root/.ollama"]
    ports: ["${BIND_ADDR:-127.0.0.1}:11434:11434"]
  api:
    build: .
    command: uvicorn escalate.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      - LLM_BASE_URL=http://ollama:11434/v1
      - DATABASE_URL=sqlite:////app/data/escalate.db
      - CHECKPOINT_DB=/app/data/checkpoints.db
      - EVIDENCE_DIR=/app/data/evidence
      - ESCALATE_SETTINGS_FILE=/app/data/settings.json
      - WEB_ORIGIN=${WEB_ORIGIN:-http://localhost:3000}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - ALLOW_LAN=${ALLOW_LAN:-false}
    volumes: ["./data:/app/data", "./secrets:/app/secrets"]
    ports: ["${BIND_ADDR:-127.0.0.1}:8000:8000"]
    depends_on: [ollama]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      retries: 12
  web:                          # the web app: http://localhost:3000
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000   # what your browser uses to reach the API
    ports: ["${BIND_ADDR:-127.0.0.1}:3000:3000"]
    depends_on:
      api:
        condition: service_healthy
