services:
  ollama:                       # free local LLM; remove if you use a cloud key
    image: ollama/ollama
    volumes: ["./data/ollama:/root/.ollama"]
    ports: ["11434:11434"]
  api:
    build: .
    command: uvicorn escalate.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      - LLM_BASE_URL=http://ollama:11434/v1
      - DATABASE_URL=sqlite:////app/data/escalate.db
      - CHECKPOINT_DB=/app/data/checkpoints.db
      - EVIDENCE_DIR=/app/data/evidence
      - ESCALATE_SETTINGS_FILE=/app/data/settings.json
      - WEB_ORIGIN=http://localhost:3000
    volumes: ["./data:/app/data", "./secrets:/app/secrets"]
    ports: ["8000:8000"]
    depends_on: [ollama]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      retries: 12
  web:                          # the web app: http://localhost:3000
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000   # what your browser uses to reach the API
    ports: ["3000:3000"]
    depends_on:
      api:
        condition: service_healthy
  ui:                           # Streamlit dev UI: http://localhost:8501
    build: .
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    environment:
      - API_URL=http://api:8000
      - PUBLIC_API_URL=http://localhost:8000
    ports: ["8501:8501"]
    depends_on:
      api:
        condition: service_healthy
