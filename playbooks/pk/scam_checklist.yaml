# Scam checklist for PK: shown before any letter in a scam case.
# TODO(verify): the current name, official website and helpline of Pakistan's national
# cybercrime reporting agency (confirm which agency handles cybercrime reports today before
# naming it), and each major bank's official fraud line.
country: PK
items:
- id: call_bank
  title: Call your bank or card issuer now
  detail: Use the number on the back of your card or on the bank's official website or app, not a number
    the scammer gave you. Ask them to stop or reverse the payment and to flag it as fraud.
- id: block_card
  title: Block the card or account that was used
  detail: Freeze or cancel the card in your banking app, or ask the bank to do it on the call.
- id: change_passwords
  title: Change your passwords
  detail: Change the password of any account you used or shared with the scammer and turn on two-step
    verification.
- id: report_national
  title: Report it to the national cybercrime agency
  detail: 'TODO(verify): name the current national cybercrime reporting agency and its official complaint
    channel. Until then, find it on the Government of Pakistan''s official website.'
- id: keep_evidence
  title: Keep every piece of evidence
  detail: Screenshots of chats, the scammer's number or profile, receipts and transaction IDs. Upload
    them here.
  urgent: false
warnings:
- Escalate will never ask for your passwords, PINs or one-time codes (OTPs). Never share them with anyone,
  including callers who say they are from your bank.
- 'Beware of ''recovery'' scammers: people who contact you offering to get your money back for a fee are
  almost always running a second scam.'
sources:
